<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1f1a16">
  <title>Lemnaria – Atelier AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
  } }
  </script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
</head>
<body>
  <header id="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Înapoi">‹</button>
    <h1 id="brand"><span>Lemn</span><b>aria</b></h1>
    <div id="topActions"></div>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a href="#/home" data-tab="home"><i>🏠</i><span>Acasă</span></a>
    <a href="#/sketch" data-tab="sketch"><i>✏️</i><span>Schiță 2D</span></a>
    <a href="#/design" data-tab="design"><i>📐</i><span>3D CAD</span></a>
    <a href="#/tools" data-tab="tools"><i>🧰</i><span>Unelte</span></a>

    <a href="#/me" data-tab="me"><i>👤</i><span>Eu</span></a>
  </nav>

  <div id="toast"></div>
  <div id="sheet" class="sheet hidden"><div class="sheet-body"></div></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=8')
          .then((reg) => {
            reg.update();
            console.log('Lemnaria Service Worker actualizat!');
          })
          .catch((err) => console.warn('Service Worker info:', err));
      });
    }
  </script>
  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
