function norm(s){
  let t = String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(un|o|niste|cel|cea|cei|cele|la|pe|in) /, '');
  t = t.split(' ').map(w => w.length > 4 ? w.replace(/(ului|ilor|elor|ul|le|lui)$/, '') : w).join(' ');
  return t;
}
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function same(a, b){
  if (!a || !b) return false;
  if (a === b) return true;
  const L = Math.min(a.length, b.length);
  return (L >= 4 && lev(a, b) <= 1) || (L >= 8 && lev(a, b) <= 2);
}
/* grupează răspunsurile și calculează punctele; merges = liste de chei unite manual */
function score(raw, players, merges){
  const groups = [];
  for (const id of players){
    const t = (raw[id] || '').trim(); if (!t) continue;
    const k = norm(t); let g = groups.find(g => g.keys.some(x => same(x, k)));
    if (!g){ g = {keys:[k], d:t, ps:[]}; groups.push(g); } else if (!g.keys.includes(k)) g.keys.push(k);
    g.ps.push(id);
  }
  for (const m of merges || []){
    const gs = groups.filter(g => g.keys.some(k => m.includes(k)));
    if (gs.length > 1){ const base = gs[0]; for (const g of gs.slice(1)){ base.keys.push(...g.keys); base.ps.push(...g.ps); groups.splice(groups.indexOf(g), 1); } }
  }
  const n = players.length, pts = {};
  for (const id of players) pts[id] = 0;
  for (const g of groups){
    const k = g.ps.length; g.pts = 0;
    if (k >= 2){ g.pts = (k - 1) + (k === n ? 2 : 0); for (const id of g.ps) pts[id] = g.pts; }
  }
  groups.sort((a, b) => b.ps.length - a.ps.length);
  const empty = players.filter(id => !(raw[id] || '').trim());
  return {groups: groups.map(g => ({d: g.d, keys: g.keys, ps: g.ps, pts: g.pts})), pts, empty};
}

const SUPA = {url: 'https://iexpkympmecyjnsyyoso.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlleHBreW1wbWVjeWpuc3l5b3NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NjU5MDcsImV4cCI6MjA5MTI0MTkwN30.LWHHPSNO5In-Lt44P6re15RLp4rIJDMmwFw79QVgRUg'};
function supaNS(){
  if (!/^https:\/\//.test(SUPA.url) || SUPA.key.startsWith('__')) return null;
  let connected = false; const connSubs = [];
  const setConn = v => { if (v !== connected){ connected = v; connSubs.forEach(f => { try { f(v); } catch(e){} }); } };
  return {
    onConnection(f){ connSubs.push(f); setTimeout(() => f(connected), 0); return () => {}; },
    async join(name){
      let ws = null, ref = 0, joinRef = null, hb = null, closed = false, mine = {}, joined = false, backoff = 1000;
      const state = {}; const subs = [];
      const wsUrl = SUPA.url.replace(/^https/, 'wss') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SUPA.key) + '&vsn=1.0.0';
      const topic = 'realtime:' + name;
      const send = (event, payload, t) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({topic: t || topic, event, payload, ref: String(++ref), join_ref: joinRef})); };
      const list = () => Object.keys(state).map(k => { const metas = state[k]; const m = metas[metas.length - 1] || {}; const p = Object.assign({}, m); delete p.phx_ref; delete p.phx_ref_prev;
        return {peer: k, by: null, isMe: k === ME, sameTab: k === ME, kind: 'viewer', guest: false, presence: p, updatedAt: Date.now()}; });
      const emit = () => { const peers = list(); subs.forEach(f => { try { f({peers, joined: [], left: [], updated: []}); } catch(e){} }); };
      const track = () => { if (joined) send('presence', {type: 'presence', event: 'track', payload: mine}); };
      function open(){
        if (closed) return;
        try { ws = new WebSocket(wsUrl); } catch(e){ setTimeout(open, backoff); return; }
        ws.onopen = () => {
          backoff = 1000; joinRef = String(++ref);
          ws.send(JSON.stringify({topic, event: 'phx_join', ref: joinRef, join_ref: joinRef,
            payload: {config: {broadcast: {self: false, ack: false}, presence: {key: ME}, private: false}, access_token: SUPA.key}}));
          clearInterval(hb); hb = setInterval(() => send('heartbeat', {}, 'phoenix'), 25000);
        };
        ws.onmessage = ev => {
          let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
          if (m.event === 'phx_reply' && m.ref === joinRef){
            if (m.payload && m.payload.status === 'ok'){ joined = true; setConn(true); track(); }
            else { setConn(false); }
          } else if (m.event === 'presence_state'){
            for (const k of Object.keys(state)) delete state[k];
            Object.assign(state, Object.fromEntries(Object.entries(m.payload || {}).map(([k, v]) => [k, v.metas || []]))); emit();
          } else if (m.event === 'presence_diff'){
            const d = m.payload || {};
            for (const [k, v] of Object.entries(d.leaves || {})){ const refs = (v.metas || []).map(x => x.phx_ref); if (state[k]){ state[k] = state[k].filter(x => !refs.includes(x.phx_ref)); if (!state[k].length) delete state[k]; } }
            for (const [k, v] of Object.entries(d.joins || {})){ state[k] = (state[k] || []).concat(v.metas || []).slice(-1); }
            emit();
          } else if (m.event === 'phx_error' || m.event === 'phx_close'){ joined = false; setConn(false); }
        };
        ws.onclose = () => { joined = false; setConn(false); clearInterval(hb); if (!closed){ setTimeout(open, backoff); backoff = Math.min(backoff * 2, 10000); } };
        ws.onerror = () => { try { ws.close(); } catch(e){} };
      }
      open();
      let pending = null;
      return {
        name,
        presence(patch){
          mine = Object.assign({}, mine);
          for (const k in patch){ if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
          // presence local imediat, trimis comasat
          state[ME] = [Object.assign({}, mine)]; emit();
          clearTimeout(pending); pending = setTimeout(track, 120);
          return Promise.resolve();
        },
        onPeers(f){ subs.push(f); setTimeout(emit, 0); return () => {}; },
        peers: list, connected: () => connected,
        leave(){ closed = true; clearInterval(hb); try { send('phx_leave', {}); ws && ws.close(); } catch(e){} return Promise.resolve(); },
      };
    },
  };
}

/* ---------------- multiplayer ---------------- */
function myPresence(extra){ return Object.assign({me: ME, name: S.name || 'Jucător', col: S.col}, extra || {}); }
function players(){ // jucătorii prezenți în cameră (cu nume), ordonați
  const seen = new Set(), out = [];
  for (const p of S.peers){
    const pr = p.presence || {}; const id = typeof pr.me === 'string' ? pr.me : null;
    if (!id || seen.has(id)) continue; seen.add(id);
    out.push({id, name: String(pr.name || 'Jucător').slice(0, 14), col: COLORS.includes(pr.col) ? pr.col : '#9D7BFF', host: !!pr.host, pr, isMe: id === ME});
  }
  return out.sort((a, b) => a.id < b.id ? -1 : 1);
}
function hostPeer(){ return players().find(p => p.host && p.pr.g); }

async function createGame(){
  const code = Array.from({length: 4}, () => 'ABCDEFGHJKLMNPRSTUVXYZ'[rnd(22)]).join('');
  S.isHost = true;
  S.g = {v:1, code, phase:'lobby', round:0, total:10, dur:20, cats:['clasic','noapte','romania','cuplu'], pid:0, prompt:'', cat:'', scores:{}, base:{}, res:null, raw:{}, merges:[], winner:null, miza:''};
  await joinRoom(code);
}
async function joinRoom(code){
  S.err = '';
  if (!roomNS){ S.err = 'Jocul multiplayer nu e disponibil în această vizualizare. Încearcă „Un singur telefon”.'; render(); return; }
  try {
    const R = await roomNS.join('glf-' + code.toLowerCase());
    S.R = R; S.code = code.toUpperCase(); S.screen = 'game';
    R.onPeers(ch => { S.peers = ch.peers; onRoomChange(); }, e => { S.err = 'Conexiunea s-a pierdut. Reintră cu codul.'; render(); });
    await pushPresence();
    store.set('glf.last', S.code);
    render();
  } catch(e){
    S.err = e && e.code === 'not_permitted' ? 'Nu ai acces la camerele de joc din această pagină.' : 'Nu m-am putut conecta. Mai încearcă o dată.';
    render();
  }
}
async function pushPresence(){
  if (!S.R) return;
  const extra = {sub: S.submittedFor};
  if (S.isHost && S.g) { extra.host = true; extra.g = S.g; } else { extra.host = null; extra.g = null; }
  if (S.g && S.g.phase === 'rev' && S.revSentFor === S.g.round) extra.ans = {r: S.g.round, t: S.answer.slice(0, 24)};
  try { await S.R.presence(myPresence(extra)); } catch(e){}
}
function leave(){
  if (S.R){ try{ S.R.leave(); }catch(e){} }
  Object.assign(S, {R:null, peers:[], g:null, isHost:false, screen:'home', answer:'', submittedFor:0, seenPid:-1, revSentFor:0});
  clearTimeout(S.hostT); render();
}

let lastHostSeen = Date.now();
function onRoomChange(){
  const hp = hostPeer();
  if (!S.isHost){
    if (hp){ lastHostSeen = Date.now(); adoptState(hp.pr.g); }
    else if (S.g && Date.now() - lastHostSeen > 4000){
      // gazda a plecat: preia jocul jucătorul cu id-ul cel mai mic
      const ps = players(); if (ps.length && ps[0].isMe){ S.isHost = true; pushPresence(); }
    }
  }
  if (S.isHost) hostTick();
  render();
}
function adoptState(g){
  if (!g || typeof g !== 'object') return;
  const prev = S.g; S.g = g;
  if (!prev || prev.pid !== g.pid){
    if (g.phase === 'q' && S.seenPid !== g.pid){ S.seenPid = g.pid; S.qStart = performance.now(); if (!prev || prev.round !== g.round){ S.answer = ''; } }
    if (g.phase === 'rev' && S.revSentFor !== g.round){ S.revSentFor = g.round; pushPresence(); }
    if (g.phase === 'lobby'){ S.submittedFor = 0; S.revSentFor = 0; S.answer = ''; }
  }
}
setInterval(() => { if (S.R) onRoomChange(); if (S.screen === 'game' && S.g && S.g.phase === 'q') paintTimer(); }, 500);

/* ---- logica gazdei ---- */
function nextPrompt(cats){
  const pool = []; for (const c of cats) for (const t of (Q[c] || [])) pool.push([c, t]);
  if (!pool.length) return ['clasic', 'Un fruct galben'];
  const key = cats.join(',');
  if (!S.bag[key] || !S.bag[key].length) S.bag[key] = shuffle(pool);
  return S.bag[key].pop();
}
function setG(patch){ S.g = Object.assign({}, S.g, patch); if (patch.pid !== undefined && S.g.phase === 'q'){ S.seenPid = S.g.pid; S.qStart = performance.now(); } pushPresence(); render(); }
function startRound(){
  const g = S.g, round = g.round + 1;
  const [cat, prompt] = nextPrompt(g.cats);
  S.answer = ''; S.submittedFor = 0;
  setG({phase:'q', round, cat, prompt, pid: g.pid + 1, res:null, raw:{}, merges:[], base: Object.assign({}, g.scores)});
}
function hostTick(){
  const g = S.g; if (!g) return;
  const ps = players();
  if (g.phase === 'q'){
    const all = ps.length > 0 && ps.every(p => (p.isMe ? S.submittedFor : p.pr.sub) === g.round);
    const elapsed = (performance.now() - S.qStart) / 1000;
    if (all || elapsed > g.dur + 1.5){ S.revSentFor = g.round; S.revWaitStart = performance.now(); setG({phase:'rev', pid: g.pid + 1, revAt: Date.now()}); }
  } else if (g.phase === 'rev' && !g.res){
    const raw = {}; let have = 0;
    for (const p of ps){
      if (p.isMe){ raw[p.id] = S.answer.slice(0, 24); have++; }
      else if (p.pr.ans && p.pr.ans.r === g.round){ raw[p.id] = String(p.pr.ans.t || '').slice(0, 24); have++; }
    }
    if (!S.revWaitStart) S.revWaitStart = performance.now();   // gazdă preluată în mijlocul rundei
    const waited = (performance.now() - S.revWaitStart) / 1000;
    if (have === ps.length || waited > 4){ finalizeRound(raw, ps.map(p => p.id), []); }
  }
}
function finalizeRound(raw, ids, merges){
  const g = S.g; S.revWaitStart = 0; const r = score(raw, ids, merges);
  const scores = Object.assign({}, g.base);
  for (const id of ids) scores[id] = (scores[id] || 0) + (r.pts[id] || 0);
  const names = {}; for (const p of players()) names[p.id] = p.name;
  setG({res: {groups: r.groups.map(x => ({d: x.d, keys: x.keys, ps: x.ps, pts: x.pts})), empty: r.empty, ids}, raw, merges, scores, names: Object.assign({}, g.names || {}, names)});
}
function mergeSelected(){
  const g = S.g; if (!g || !g.res || S.sel.length < 2) return;
  const keys = []; for (const i of S.sel){ const gr = g.res.groups[i]; if (gr) keys.push(...gr.keys); }
  const merges = (g.merges || []).concat([keys]); S.sel = [];
  finalizeRound(g.raw, g.res.ids, merges);
}
function nextOrEnd(){
  const g = S.g;
  if (g.round >= g.total){
    const ids = Object.keys(g.scores); const best = Math.max(0, ...ids.map(i => g.scores[i]));
    setG({phase:'end', pid: g.pid + 1, winner: ids.filter(i => g.scores[i] === best), miza: MIZE[rnd(MIZE.length)]});
  } else startRound();
}
function rematch(){ S.submittedFor = 0; setG({phase:'lobby', round:0, pid: S.g.pid + 1, scores:{}, base:{}, res:null, raw:{}, merges:[], winner:null}); }

function submitAnswer(){
  const inp = $('ans'); if (inp) S.answer = inp.value.trim().slice(0, 24);
  if (!S.answer) return;
  S.submittedFor = S.g.round; pushPresence(); render();
  if (S.isHost) hostTick();
}

/* ---------------- un singur telefon ---------------- */
function localStart(){
  const names = (S.localNames || []).map(s => s.trim()).filter(Boolean).slice(0, 8);
  if (names.length < 2) { S.err = 'Adaugă cel puțin 2 jucători.'; render(); return; }
  S.err = '';
  S.local = {names, ids: names.map((_, i) => 'l' + i), total: S.localTotal || 10, cats: S.localCats || ['clasic','noapte','romania','cuplu'], round: 0, scores: {}, step: 0, raw: {}, res: null, phase: 'q', merges: []};
  localNext();
}
function localNext(){
  const L = S.local;
  if (L.round >= L.total){ L.phase = 'end'; render(); return; }
  L.round++; const [cat, prompt] = nextPrompt(L.cats); Object.assign(L, {cat, prompt, step: 0, raw: {}, res: null, phase: 'hand', merges: []}); render();
}
function localFinal(){ const L = S.local; const r = score(L.raw, L.ids, L.merges); L.res = r; L.base = L.base && L.base.round === L.round ? L.base : {round: L.round, s: Object.assign({}, L.scores)};
  L.scores = Object.assign({}, L.base.s); for (const id of L.ids) L.scores[id] = (L.scores[id] || 0) + (r.pts[id] || 0); L.phase = 'rev'; render(); }

function render(){
  const app = $('app'); let h = '';
  if (S.rulesOpen) h = scrRules();
  else if (S.local) h = scrLocal();
  else if (S.screen === 'home') h = scrHome();
  else if (S.screen === 'localsetup') h = scrLocalSetup();
  else h = scrGame();
  if (h === lastHtml){ paintTimer(); return; }   // nimic nou: nu redesenăm (păstrăm tastarea și animațiile)
  const screenKey = h.slice(0, 160).replace(/value="[^"]*"/g, '');
  const sameScreen = screenKey === lastKey; lastHtml = h; lastKey = screenKey;
  const focused = document.activeElement && document.activeElement.id; const val = focused && $(focused) ? $(focused).value : null;
  const sel = focused && $(focused) && $(focused).selectionStart != null ? [$(focused).selectionStart, $(focused).selectionEnd] : null;
  app.innerHTML = sameScreen ? h.replace(/class="fade /g, 'class="').replace(/ pop /g, ' ').replace(/ pop"/g, '"') : h;
  if (focused && $(focused)){ const el = $(focused); if (val != null) el.value = val; el.focus({preventScroll: true}); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} }
  paintTimer();
}

      </div>
      ${done ? `<div class="card stack" style="text-align:center"><span class="kick">Răspunsul tău</span><div class="prompt neon neon-green" style="font-size:34px">${esc(S.answer)}</div><button class="link" data-act="edit">Schimbă răspunsul</button></div>`
             : `<div class="stack"><input class="field" id="ans" maxlength="24" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="Răspunsul tău…" value="${esc(S.answer)}"><button class="btn green solid" data-act="submit">Trimite</button></div>`}
      <div class="card"><span class="kick">Au răspuns</span><div class="chips" style="margin-top:8px">${ps.map(p => { const ok = (p.isMe ? S.submittedFor : p.pr.sub) === g.round; return `<span class="chip" style="--c:${p.col}" aria-pressed="${ok}">${ok ? '✓ ' : ''}${esc(p.name)}</span>`; }).join('')}</div></div>
    </section>`;
  }
  if (g.phase === 'rev'){
    const c = catOf(g.cat);
    if (!g.res) return `<section class="fade stack">${topBar()}<div class="card glowbox" style="--c:${c.c};text-align:center"><div class="prompt neon" style="--c:${c.c}">${esc(g.prompt)}</div><p class="mute">Strâng răspunsurile…</p></div></section>`;
    const names = g.names || {};
    const nm = id => esc(names[id] || (ps.find(p => p.id === id) || {}).name || 'Jucător');
    const groups = g.res.groups.map((gr, i) => `<div class="group pop ${gr.ps.length > 1 ? 'match' : ''} ${S.sel.includes(i) ? 'sel' : ''}" style="animation-delay:${i * 120}ms" ${S.isHost ? `data-act="sel" data-v="${i}" role="button" tabindex="0" aria-pressed="${S.sel.includes(i)}"` : ''}>
        <div class="row"><span class="ans grow">${esc(gr.d)}</span>${gr.pts ? `<span class="plus">+${gr.pts}</span>` : ''}</div>
        <div class="who">${gr.ps.map(id => `<span>${nm(id)}</span>`).join('')}</div></div>`).join('');
    const empty = (g.res.empty || []).length ? `<p class="small mute" style="margin:0">Fără răspuns: ${g.res.empty.map(nm).join(', ')}</p>` : '';
    const board = Object.keys(g.scores).sort((a, b) => g.scores[b] - g.scores[a]).map(id => { const p = ps.find(x => x.id === id) || {name: names[id] || 'Jucător', col: '#9D7BFF'}; return `<div class="pl">${avatar(p)}<span class="nm">${esc(p.name)}${id === ME ? ' (tu)' : ''}</span><span class="pts">${g.scores[id]}</span></div>`; }).join('');
    return `<section class="fade stack">${topBar()}
      <div class="card glowbox" style="--c:${c.c};text-align:center"><span class="catchip" style="--c:${c.c}">${esc(c.name)}</span><div class="prompt neon" style="--c:${c.c};font-size:30px">${esc(g.prompt)}</div></div>
      <div class="stack">${groups}${empty}</div>
      ${S.isHost ? `<p class="small mute" style="margin:0;text-align:center">Două răspunsuri înseamnă același lucru? Atinge-le pe amândouă și apasă „Sunt la fel”.</p>
        <button class="btn yellow sm" data-act="merge" ${S.sel.length >= 2 ? '' : 'disabled'}>Sunt la fel</button>` : ''}
      <div class="card stack"><span class="kick">Scor</span><div class="players">${board}</div></div>
      ${S.isHost ? `<button class="btn solid" data-act="next">${g.round >= g.total ? 'Vezi câștigătorul' : 'Runda următoare'}</button>` : `<p class="status">Gazda trece la runda următoare.</p>`}
    </section>`;
  }
  if (g.phase === 'end'){
    const names = g.names || {};
    const rank = Object.keys(g.scores).sort((a, b) => g.scores[b] - g.scores[a]);
    const P = id => ps.find(x => x.id === id) || {name: names[id] || 'Jucător', col: '#9D7BFF'};
    const top = [rank[1], rank[0], rank[2]].filter(Boolean);
    const hts = {0: 150, 1: 105, 2: 75}; const cols = {0: 'var(--pink)', 1: 'var(--cyan)', 2: 'var(--yellow)'};
    const pod = top.map(id => { const pl = rank.indexOf(id); return `<div class="pod"><span class="nm">${esc(P(id).name)}</span><span class="pts" style="font:800 22px var(--f-sign)">${g.scores[id]}</span><div class="blk" style="height:${hts[pl]}px;--c:${cols[pl]}">${pl + 1}</div></div>`; }).join('');
    const win = (g.winner || []).map(id => esc(P(id).name)).join(' și ');
    return `<section class="fade stack">${topBar()}
      <h2 class="neon neon-yellow" style="font-size:44px;text-align:center;margin-top:8px">${(g.winner || []).length > 1 ? 'EGALITATE!' : 'CÂȘTIGĂ'}</h2>
      <p class="prompt neon neon-pink" style="font-size:40px">${win}</p>
      <div class="podium">${pod}</div>
      <div class="card glowbox stack" style="--c:var(--green);text-align:center"><span class="kick">Miza pentru ceilalți</span><div style="font:800 26px/1.1 var(--f-sign)" class="neon neon-green">${esc(g.miza)}</div></div>
      ${S.isHost ? `<button class="btn solid" data-act="rematch">Revanșă</button>` : `<p class="status">Gazda poate porni revanșa.</p>`}
      <button class="btn violet sm" data-act="leave">Ieși din joc</button>
    </section>`;
  }
  return '';
}
function paintTimer(){
  const g = S.g; const bar = $('tbar'), num = $('tnum'); if (!g || g.phase !== 'q' || !bar) return;
  const left = Math.max(0, g.dur - (performance.now() - S.qStart) / 1000);
  bar.style.transform = `scaleX(${left / g.dur})`; num.textContent = Math.ceil(left);
  if (left <= 0 && S.submittedFor !== g.round){ const inp = $('ans'); if (inp && inp.value.trim()){ S.answer = inp.value.trim().slice(0, 24); S.submittedFor = g.round; pushPresence(); render(); } }
}

/* ---- un singur telefon: ecrane ---- */
function scrLocalSetup(){
  const names = S.localNames || (S.localNames = [S.name || 'Ned', 'Andreea']);
  const cats = S.localCats || (S.localCats = ['clasic','noapte','romania','cuplu']); const total = S.localTotal || (S.localTotal = 10);
  return `<section class="fade stack"><h2 class="neon neon-cyan" style="font-size:40px;margin-top:14px">UN SINGUR TELEFON</h2>
    <p class="mute" style="margin:0">Telefonul trece din mână în mână. Fiecare scrie răspunsul fără să vadă ceilalți.</p>
    <div class="card stack"><span class="kick">Jucători</span>
      ${names.map((n, i) => `<div class="row"><input class="field grow" id="ln${i}" data-ln="${i}" maxlength="14" value="${esc(n)}" placeholder="Jucătorul ${i + 1}">${names.length > 2 ? `<button class="btn sm violet" style="width:54px" data-act="lndel" data-v="${i}" aria-label="Șterge">×</button>` : ''}</div>`).join('')}
      ${names.length < 8 ? `<button class="btn sm cyan" data-act="lnadd">+ Jucător</button>` : ''}</div>
    <div class="card">${settingsChips({cats, total, dur: 20}, true).replace(/data-act="cat"/g, 'data-act="lcat"').replace(/data-act="total"/g, 'data-act="ltotal"').replace(/<span class="kick">Timp<\/span>[\s\S]*?<\/div>\s*<\/div>$/, '</div>')}</div>
    ${S.err ? `<p class="status" style="color:var(--red)">${esc(S.err)}</p>` : ''}
    <button class="btn solid" data-act="lstart">Începe</button><button class="link" data-act="home">Înapoi</button></section>`;
}
function scrLocal(){
  const L = S.local; const c = catOf(L.cat);
  const nm = i => esc(L.names[i]);
  if (L.phase === 'hand'){
    return `<section class="fade hand stack"><span class="kick">Runda ${L.round}/${L.total} · dă telefonul lui</span><div class="who neon neon-pink">${nm(L.step)}</div>
      <p class="mute">Ceilalți nu se uită.</p><button class="btn solid" data-act="lshow">Sunt ${nm(L.step)}</button><button class="link" data-act="lquit">Ieși</button></section>`;
  }
  if (L.phase === 'type'){
    return `<section class="fade stack"><div class="top"><span class="kick">${nm(L.step)} · runda ${L.round}/${L.total}</span></div>
      <div class="card glowbox stack" style="--c:${c.c};text-align:center"><span><span class="catchip" style="--c:${c.c}">${esc(c.name)}</span></span><div class="prompt neon" style="--c:${c.c}">${esc(L.prompt)}</div></div>
      <input class="field" id="lans" maxlength="24" autocomplete="off" autocapitalize="off" placeholder="Răspunsul tău…"><button class="btn green solid" data-act="lsubmit">Gata</button></section>`;
  }
  if (L.phase === 'rev'){
    const r = L.res;
    const groups = r.groups.map((gr, i) => `<div class="group pop ${gr.ps.length > 1 ? 'match' : ''} ${S.sel.includes(i) ? 'sel' : ''}" data-act="lsel" data-v="${i}" role="button" tabindex="0" style="animation-delay:${i * 120}ms"><div class="row"><span class="ans grow">${esc(gr.d)}</span>${gr.pts ? `<span class="plus">+${gr.pts}</span>` : ''}</div><div class="who">${gr.ps.map(id => `<span>${nm(+id.slice(1))}</span>`).join('')}</div></div>`).join('');
    const board = L.ids.slice().sort((a, b) => (L.scores[b] || 0) - (L.scores[a] || 0)).map(id => `<div class="pl"><span class="nm">${nm(+id.slice(1))}</span><span class="pts">${L.scores[id] || 0}</span></div>`).join('');
    return `<section class="fade stack"><div class="card glowbox" style="--c:${c.c};text-align:center"><div class="prompt neon" style="--c:${c.c};font-size:30px">${esc(L.prompt)}</div></div>
      <div class="stack">${groups}</div><button class="btn yellow sm" data-act="lmerge" ${S.sel.length >= 2 ? '' : 'disabled'}>Sunt la fel</button>
      <div class="card stack"><span class="kick">Scor</span><div class="players">${board}</div></div>
      <button class="btn solid" data-act="lnext">${L.round >= L.total ? 'Vezi câștigătorul' : 'Runda următoare'}</button></section>`;
  }
  if (L.phase === 'end'){
    const best = Math.max(...L.ids.map(id => L.scores[id] || 0)); const win = L.ids.filter(id => (L.scores[id] || 0) === best).map(id => nm(+id.slice(1)));
    S.localMiza = S.localMiza || MIZE[rnd(MIZE.length)];
    return `<section class="fade stack"><h2 class="neon neon-yellow" style="font-size:44px;text-align:center;margin-top:16px">${win.length > 1 ? 'EGALITATE!' : 'CÂȘTIGĂ'}</h2>
      <p class="prompt neon neon-pink" style="font-size:40px">${win.join(' și ')}</p>
      <div class="card glowbox stack" style="--c:var(--green);text-align:center"><span class="kick">Miza pentru ceilalți</span><div style="font:800 26px/1.1 var(--f-sign)" class="neon neon-green">${esc(S.localMiza)}</div></div>
      <button class="btn solid" data-act="lagain">Revanșă</button><button class="link" data-act="lquit">Ieși</button></section>`;
  }
  return '';
}

/* ---------------- evenimente ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v; const g = S.g;
  switch (a){
    case 'col': S.col = v; store.set('glf.col', v); render(); break;
    case 'create': saveName(); if (!S.name){ S.err = 'Scrie-ți numele.'; render(); break; } createGame(); break;
    case 'join': { saveName(); const code = ($('code') || {}).value || ''; if (!S.name){ S.err = 'Scrie-ți numele.'; render(); break; }
      if (!/^[A-Za-z]{4}$/.test(code.trim())){ S.err = 'Codul are 4 litere.'; render(); break; } S.isHost = false; S.g = null; joinRoom(code.trim()); break; }
    case 'leave': leave(); break;
    case 'copy': { const u = inviteUrl(S.code); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => { el.textContent = 'Link copiat!'; }).catch(() => { prompt && el.insertAdjacentHTML('afterend', `<p class="small" style="word-break:break-all">${esc(u)}</p>`); }); break; }
    case 'rules': S.rulesOpen = true; render(); break;
    case 'rulesclose': S.rulesOpen = false; render(); break;
    case 'cat': if (S.isHost && g){ const cats = g.cats.includes(v) ? g.cats.filter(x => x !== v) : g.cats.concat(v); if (cats.length) setG({cats}); } break;
    case 'total': if (S.isHost && g) setG({total: +v}); break;
    case 'dur': if (S.isHost && g) setG({dur: +v}); break;
    case 'start': if (S.isHost) startRound(); break;
    case 'submit': submitAnswer(); break;
    case 'edit': S.submittedFor = 0; pushPresence(); render(); setTimeout(() => $('ans') && $('ans').focus(), 30); break;
    case 'sel': { const i = +v; S.sel = S.sel.includes(i) ? S.sel.filter(x => x !== i) : S.sel.concat(i); render(); break; }
    case 'merge': mergeSelected(); break;
    case 'next': S.sel = []; nextOrEnd(); break;
    case 'rematch': rematch(); break;
    case 'localsetup': saveName(); S.err = ''; S.screen = 'localsetup'; render(); break;
    case 'home': S.screen = 'home'; S.err = ''; render(); break;
    case 'lnadd': readLocalNames(); S.localNames.push(''); render(); break;
    case 'lndel': readLocalNames(); S.localNames.splice(+v, 1); render(); break;
    case 'lcat': { readLocalNames(); const c = S.localCats; S.localCats = c.includes(v) ? (c.length > 1 ? c.filter(x => x !== v) : c) : c.concat(v); render(); break; }
    case 'ltotal': readLocalNames(); S.localTotal = +v; render(); break;
    case 'lstart': readLocalNames(); S.localMiza = null; localStart(); break;
    case 'lshow': S.local.phase = 'type'; render(); setTimeout(() => $('lans') && $('lans').focus(), 30); break;
    case 'lsubmit': { const L = S.local; L.raw[L.ids[L.step]] = (($('lans') || {}).value || '').trim().slice(0, 24); L.step++; if (L.step >= L.names.length) localFinal(); else { L.phase = 'hand'; render(); } break; }
    case 'lsel': { const i = +v; S.sel = S.sel.includes(i) ? S.sel.filter(x => x !== i) : S.sel.concat(i); render(); break; }
    case 'lmerge': { const L = S.local; const keys = []; for (const i of S.sel){ keys.push(...L.res.groups[i].keys); } L.merges.push(keys); S.sel = []; localFinal(); break; }
    case 'lnext': S.sel = []; localNext(); break;
    case 'lagain': S.localMiza = null; S.local = null; localStart(); break;
    case 'lquit': S.local = null; S.screen = 'home'; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    if (e.target.id === 'ans'){ e.preventDefault(); submitAnswer(); }
    else if (e.target.id === 'lans'){ e.preventDefault(); document.querySelector('[data-act="lsubmit"]').click(); }
    else if (e.target.id === 'code'){ e.preventDefault(); document.querySelector('[data-act="join"]').click(); }
    else if (e.target.closest && e.target.closest('[data-act="sel"],[data-act="lsel"]')){ e.preventDefault(); e.target.click(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ans') S.answer = e.target.value.slice(0, 24);
  if (e.target.id === 'nm') { S.name = e.target.value.slice(0, 14); store.set('glf.name', S.name); }
  if (e.target.id === 'code') S.codeDraft = e.target.value.toUpperCase();
});
function inviteUrl(code){ return location.origin + location.pathname + '?cod=' + code; }
try { const c = new URLSearchParams(location.search).get('cod'); if (c && /^[A-Za-z]{4}$/.test(c)) S.codeDraft = c.toUpperCase(); } catch(e){}
function saveName(){ const el = $('nm'); if (el){ S.name = el.value.trim().slice(0, 14); store.set('glf.name', S.name); } }
function readLocalNames(){ if (!S.localNames) return; S.localNames = S.localNames.map((n, i) => { const el = $('ln' + i); return el ? el.value : n; }); }

render();
</script>
</body></html>
